
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirPrishtina - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navigation bar */
        .navbar {
            width: 100%;
            height: 65px;
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #292d64;
        }

        .logo span {
            font-size: 27px;
            margin-right: 8px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #22223b;
            font-size: 14px;
        }

        nav a:hover {
            color: #4169e1;
        }

        /* Main background */
        .hero {
            height: calc(100vh - 65px);
            width: 100%;
            background-image:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.45),
                    transparent 55%
                ),
                url("airport.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 30px 15px;
        }

        .hero h1 {
            color: white;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 800;
            text-align: center;
        }

        /* Mobile version */
        @media (max-width: 600px) {
            .navbar {
                height: auto;
                padding: 15px;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 12px;
            }

            .hero {
                height: calc(100vh - 100px);
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>✈</span> AirPrishtina
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact Us</a>
            <a href="#tickets">Book Tickets</a>
        </nav>

    </header>

    <section class="hero" id="home">
        <h1>Small country, big heart!</h1>
    </section>

</body>
</html>
